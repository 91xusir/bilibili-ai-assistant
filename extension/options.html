<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Bilibili AI 视频助手 · 设置</title>
  <link rel="stylesheet" href="pages.css">
  <style>
    .page { max-width: 620px; margin: 0 auto; padding: 24px 20px 60px; }
    header.page-head { margin-bottom: 20px; }
    header.page-head p { color: var(--bia-text-2); font-size: 12px; margin: 6px 0 0; }
    .hint { color: var(--bia-text-2); font-size: 11.5px; line-height: 1.6; margin: 6px 0 10px; }
  </style>
</head>
<body>
  <main class="page">
    <header class="page-head">
      <h1>Bilibili AI 视频助手 · 设置</h1>
      <p>配置保存在本地浏览器 (chrome.storage.local), 不会上传到任何服务器。</p>
    </header>

    <section class="section">
      <h2>AI 任务</h2>
      <div id="task-toggles"></div>
    </section>

    <section class="section">
      <h2>AI 服务商</h2>
      <p class="hint">默认使用 Kimi 网页版 (免 API Key, 复用 kimi.com 登录态); 也可切换为 OpenAI 兼容接口。</p>
      <div id="provider-row" class="bia-provider-row"></div>
      <div id="kimi-box"></div>
      <div id="openai-box"></div>
      <div id="test-row" class="bia-test-row"></div>
    </section>

    <section class="section">
      <h2>缓存</h2>
      <div id="cache-box"></div>
    </section>

    <section class="section">
      <h2>缓存管理</h2>
      <p class="hint">按视频列出已缓存的字幕与总结/广告结果; 清理时会同时删除该视频的全部缓存。</p>
      <input id="cache-search" class="bia-input bia-cache-search" type="search"
             placeholder="搜索标题 / 视频键" autocomplete="off" spellcheck="false">
      <div id="cache-manage"></div>
    </section>

    <div class="bia-settings-actions" id="save-row"></div>
  </main>
  <script src="options.js" defer></script>
</body>
</html>
